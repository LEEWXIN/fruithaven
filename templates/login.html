{% extends 'base.html' %}
{% block title %}Login — FruitHaven{% endblock %}
{% block content %}
<div style="max-width:400px;margin:4rem auto;padding:0 1.5rem">
  <div style="text-align:center;margin-bottom:2rem">
    <div style="font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--gold);margin-bottom:.25rem">FruitHaven</div>
    <p style="color:var(--text-muted);font-size:.9rem">Welcome back</p>
  </div>

  <form method="POST" action="{{ url_for('login') }}"
        style="background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:2rem">
    <div class="form-row">
      <label>Username</label>
      <input type="text" name="username" placeholder="Enter your username" required autofocus />
    </div>
    <div class="form-row">
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter your password" required />
    </div>
    <button type="submit" class="form-submit">Login</button>
    <p style="text-align:center;margin-top:1rem;font-size:.85rem;color:var(--text-muted)">
      Don't have an account? <a href="{{ url_for('register') }}" style="color:var(--gold)">Register</a>
    </p>
  </form>
</div>
{% endblock %}
