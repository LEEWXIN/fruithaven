{% extends 'base.html' %}
{% block title %}Contact — FruitHaven{% endblock %}
{% block content %}
<div class="contact-section">
  <h2>Get in Touch</h2>
  <p class="sub">Questions about an order, or just want to say hello?</p>
  <form method="POST" action="{{ url_for('contact') }}" class="contact-form">
    <div class="form-row"><label>Name</label><input type="text" name="name" placeholder="Your name" required /></div>
    <div class="form-row"><label>Email</label><input type="email" name="email" placeholder="you@email.com" required /></div>
    <div class="form-row"><label>Subject</label><input type="text" name="subject" placeholder="What's this about?" required /></div>
    <div class="form-row"><label>Message</label><textarea name="message" rows="5" placeholder="Tell us more..." required></textarea></div>
    <button type="submit" class="form-submit">Send Message</button>
  </form>
</div>
{% endblock %}
